services:
  card-api:
    container_name: card-api
    image: dario-service-card-api:latest
    build:
      context: ..
      dockerfile: Card/Dockerfile

    restart: unless-stopped

    ports:
      - "${SERVICE_PORT}:10010"
    environment:
      CardServices__ServicePort: "${SERVICE_PORT}"
      ASPNETCORE_ENVIRONMENT: "Production"
      CardServices__ConnectionString: ${CARD_DB_CONNECTION_STRING}
      CardServices__ConnectionStringQuery: ${CARD_DB_CONNECTION_STRING_QUERY}
      CARD_ENCRYPTION_KEY: "${CARD_ENCRYPTION_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=Dario.Service.Card.API,service.version=1.0.0,deployment.environment=Production"

    networks:
      - oracle_observe

networks:
  oracle_observe:
    external: true